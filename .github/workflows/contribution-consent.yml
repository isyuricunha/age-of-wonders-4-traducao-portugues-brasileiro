name: Contribution permission
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  affirmative-permission:
    runs-on: ubuntu-latest
    steps:
      # Run the trusted base-branch checker; never execute a fork's proposed code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -B translation-work/consent_check.py
